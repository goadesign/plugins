openapi: 3.0.3
info:
    title: Calculator Service
    version: 0.0.1
servers:
    - url: http://localhost:80
      description: Default server for calc
paths:
    /add/{left}/{right}:
        get:
            tags:
                - calc
            summary: add calc
            operationId: calc#add
            parameters:
                - name: left
                  in: path
                  description: Left operand
                  required: true
                  schema:
                    type: integer
                    description: Left operand
                    example: 8133055152903002499
                    format: int64
                  example: 3219793201326175278
                - name: right
                  in: path
                  description: Right operand
                  required: true
                  schema:
                    type: integer
                    description: Right operand
                    example: 8803302123552712831
                    format: int64
                  example: 5401762099778430809
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                type: integer
                                example: 360622074634248926
                                format: int64
                            example: 1918630006328122782
    /swagger.json:
        get:
            tags:
                - calc
            summary: Download ../../gen/http/openapi.json
            operationId: calc#/swagger.json
            responses:
                "200":
                    description: File downloaded
components: {}
tags:
    - name: calc
      description: The calc service performs additions on numbers
