openapi: 3.2.0
info:
    title: Calculator Service
    description: HTTP service for adding numbers, a goa teaser
    version: 0.0.1
servers:
    - url: http://localhost:8000/calc
      name: calc-development
      description: calc hosts the Calculator Service.
    - url: https://{version}.goa.design/calc
      name: calc-production
      description: calc hosts the Calculator Service.
      variables:
        version:
            default: v1
paths:
    /add/{a}/{b}:
        get:
            tags:
                - calc
            summary: add calc
            operationId: calc#add
            parameters:
                - name: a
                  in: path
                  description: Left operand
                  required: true
                  schema:
                    type: integer
                    description: Left operand
                    example: 7101074584653383974
                    format: int64
                  example: 2989948904695875606
                - name: b
                  in: path
                  description: Right operand
                  required: true
                  schema:
                    type: integer
                    description: Right operand
                    example: 5365422230106384248
                    format: int64
                  example: 8103102529540563611
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                type: integer
                                example: 6252541931587653406
                                format: int64
                            example: 6252541931587653406
    /swagger.json:
        get:
            tags:
                - calc
            summary: Download ../../gen/http/openapi.json
            operationId: calc#/swagger.json
            responses:
                "200":
                    description: File downloaded
components: {}
tags:
    - name: calc
      description: The calc service performs operations on numbers
