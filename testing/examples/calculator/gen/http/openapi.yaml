swagger: "2.0"
info:
    title: ""
    version: 0.0.1
host: localhost:80
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /add:
        post:
            tags:
                - calculator
            summary: add calculator
            description: Add two numbers
            operationId: calculator#add
            parameters:
                - name: AddRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/CalculatorAddRequestBody'
                    required:
                        - a
                        - b
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/CalculatorAddResponseBody'
                        required:
                            - result
                            - operation
            schemes:
                - http
    /batch/add:
        get:
            tags:
                - calculator
            summary: batch_add calculator
            description: Add multiple pairs of numbers using streaming
            operationId: calculator#batch_add
            responses:
                "101":
                    description: Switching Protocols response.
                    schema:
                        $ref: '#/definitions/CalculatorBatchAddResponseBody'
                        required:
                            - result
                            - index
            schemes:
                - ws
    /divide:
        post:
            tags:
                - calculator
            summary: divide calculator
            description: Divide two numbers
            operationId: calculator#divide
            parameters:
                - name: DivideRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/CalculatorDivideRequestBody'
                    required:
                        - dividend
                        - divisor
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/CalculatorDivideResponseBody'
                        required:
                            - result
                            - operation
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/CalculatorError'
                        required:
                            - message
                            - code
            schemes:
                - http
    /factorial:
        post:
            tags:
                - calculator
            summary: factorial calculator
            description: Calculate factorial of a number
            operationId: calculator#factorial
            parameters:
                - name: FactorialRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/CalculatorFactorialRequestBody'
                    required:
                        - "n"
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/CalculatorFactorialResponseBody'
                        required:
                            - result
                            - operation
                            - computation_time_ms
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/CalculatorError'
                        required:
                            - message
                            - code
            schemes:
                - http
    /statistics:
        post:
            tags:
                - calculator
            summary: statistics calculator
            description: Calculate statistics for a list of numbers
            operationId: calculator#statistics
            parameters:
                - name: StatisticsRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/CalculatorStatisticsRequestBody'
                    required:
                        - numbers
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/CalculatorStatisticsResponseBody'
                        required:
                            - mean
                            - median
                            - min
                            - max
                            - count
                            - sum
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/CalculatorError'
                        required:
                            - message
                            - code
            schemes:
                - http
definitions:
    CalculatorAddRequestBody:
        title: CalculatorAddRequestBody
        type: object
        properties:
            a:
                type: number
                description: First number
                example: 0.5822864875285534
                format: double
            b:
                type: number
                description: Second number
                example: 0.9122579247007714
                format: double
        example:
            a: 0.6855891234637396
            b: 0.6902183502258604
        required:
            - a
            - b
    CalculatorAddResponseBody:
        title: CalculatorAddResponseBody
        type: object
        properties:
            operation:
                type: string
                description: Operation performed
                example: Nemo eum aut.
            result:
                type: number
                description: Sum of a and b
                example: 0.7269881494235838
                format: double
        example:
            operation: Temporibus non quidem exercitationem.
            result: 0.45592313716965976
        required:
            - result
            - operation
    CalculatorBatchAddResponseBody:
        title: CalculatorBatchAddResponseBody
        type: object
        properties:
            index:
                type: integer
                description: Operation index
                example: 1886316699477631565
                format: int64
            result:
                type: number
                description: Sum
                example: 0.4643051080345308
                format: double
        example:
            index: 1190498043252101559
            result: 0.1437650945689561
        required:
            - result
            - index
    CalculatorDivideRequestBody:
        title: CalculatorDivideRequestBody
        type: object
        properties:
            dividend:
                type: number
                description: Number to divide
                example: 0.18515492403835837
                format: double
            divisor:
                type: number
                description: Number to divide by
                example: 0.19096690763812
                format: double
        example:
            dividend: 0.5637655387216421
            divisor: 0.6971797128752864
        required:
            - dividend
            - divisor
    CalculatorDivideResponseBody:
        title: CalculatorDivideResponseBody
        type: object
        properties:
            operation:
                type: string
                description: Operation performed
                example: Animi recusandae fuga et.
            result:
                type: number
                description: Division result
                example: 0.44101455761365893
                format: double
        example:
            operation: Ab perferendis quibusdam.
            result: 0.17670574146504664
        required:
            - result
            - operation
    CalculatorError:
        title: CalculatorError
        type: object
        properties:
            code:
                type: string
                description: Error code
                example: Et similique enim sed.
            message:
                type: string
                description: Error message
                example: Quia est et provident at.
        description: Cannot divide by zero
        example:
            code: Doloremque recusandae corporis doloribus in.
            message: Dolor perferendis nihil.
        required:
            - message
            - code
    CalculatorFactorialRequestBody:
        title: CalculatorFactorialRequestBody
        type: object
        properties:
            "n":
                type: integer
                description: Number to calculate factorial of
                example: 0
                format: int64
                minimum: 0
                maximum: 20
        example:
            "n": 10
        required:
            - "n"
    CalculatorFactorialResponseBody:
        title: CalculatorFactorialResponseBody
        type: object
        properties:
            computation_time_ms:
                type: integer
                description: Time taken in milliseconds
                example: 9063384614896753475
                format: int64
            operation:
                type: string
                description: Operation performed
                example: Neque amet eius earum voluptas.
            result:
                type: integer
                description: Factorial result
                example: 9135770145502173160
                format: int64
        example:
            computation_time_ms: 7169924634579431694
            operation: Dicta facilis.
            result: 3943339354666893251
        required:
            - result
            - operation
            - computation_time_ms
    CalculatorStatisticsRequestBody:
        title: CalculatorStatisticsRequestBody
        type: object
        properties:
            numbers:
                type: array
                items:
                    type: number
                    example: 0.31480425780197624
                    format: double
                description: List of numbers
                example:
                    - 0.4376387987328411
                    - 0.33865881007020904
                minItems: 1
        example:
            numbers:
                - 0.24198338232539035
                - 0.7562492625361671
                - 0.3004363720253203
        required:
            - numbers
    CalculatorStatisticsResponseBody:
        title: CalculatorStatisticsResponseBody
        type: object
        properties:
            count:
                type: integer
                description: Number of values
                example: 1498661236401425438
                format: int64
            max:
                type: number
                description: Maximum value
                example: 0.7702570357692888
                format: double
            mean:
                type: number
                description: Average of numbers
                example: 0.6753227346276343
                format: double
            median:
                type: number
                description: Median value
                example: 0.31278325148050157
                format: double
            min:
                type: number
                description: Minimum value
                example: 0.556325824397252
                format: double
            sum:
                type: number
                description: Sum of all values
                example: 0.4879789135538508
                format: double
        example:
            count: 9075380499056270474
            max: 0.6295158740447375
            mean: 0.5020243360103577
            median: 0.6002697939946622
            min: 0.7378037053373933
            sum: 0.8244287072532461
        required:
            - mean
            - median
            - min
            - max
            - count
            - sum
