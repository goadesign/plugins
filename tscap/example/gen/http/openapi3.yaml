openapi: 3.0.3
info:
    title: Tailscale Capabilities Example API
    description: An example API demonstrating Tailscale app capabilities authorization
    version: 0.0.1
servers:
    - url: http://localhost:80
      description: Default server for tscap_example
paths:
    /health:
        get:
            tags:
                - tscap
            summary: health tscap
            description: Health check - no capability required
            operationId: tscap#health
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                type: string
                                example: Consequuntur numquam dolorem aut.
                            example: Praesentium voluptas est dicta tempora libero.
    /items:
        get:
            tags:
                - tscap
            summary: list tscap
            description: List items - requires read capability
            operationId: tscap#list
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    type: string
                                    example: Molestiae similique sed nisi numquam.
                                example:
                                    - Id labore.
                                    - Earum vitae dolores commodi dignissimos dolor ut.
                                    - Sed libero voluptatum fuga.
                                    - Qui consequatur et est.
                            example:
                                - Dicta aut aspernatur vel.
                                - Pariatur fuga ut molestias aut.
        post:
            tags:
                - tscap
            summary: create tscap
            description: Create an item - requires write capability
            operationId: tscap#create
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateRequestBody'
                        example:
                            name: Voluptatem similique dignissimos.
            responses:
                "201":
                    description: Created response.
                    content:
                        application/json:
                            schema:
                                type: string
                                example: Nihil quo quam et dignissimos.
                            example: Voluptas dicta quibusdam vel enim.
    /items/{id}:
        delete:
            tags:
                - tscap
            summary: admin tscap
            description: Admin action - requires admin capability
            operationId: tscap#admin
            parameters:
                - name: id
                  in: path
                  description: Item ID
                  required: true
                  schema:
                    type: string
                    description: Item ID
                    example: Magnam explicabo provident ut ipsam.
                  example: Placeat et et.
            responses:
                "204":
                    description: No Content response.
    /openapi.json:
        get:
            tags:
                - openapi
            summary: Download gen/http/openapi3.json
            operationId: openapi#/openapi.json
            responses:
                "200":
                    description: File downloaded
components:
    schemas:
        CreateRequestBody:
            type: object
            properties:
                name:
                    type: string
                    description: Item name
                    example: Omnis in.
            example:
                name: Ea vel.
            required:
                - name
tags:
    - name: openapi
    - name: tscap
      description: A service demonstrating Tailscale app capabilities
