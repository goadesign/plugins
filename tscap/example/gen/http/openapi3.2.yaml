openapi: 3.2.0
info:
    title: Tailscale Capabilities Example API
    description: An example API demonstrating Tailscale app capabilities authorization
    version: 0.0.1
servers:
    - url: http://localhost:80
      name: tscap_example
      description: Default server for tscap_example
paths:
    /health:
        get:
            tags:
                - tscap
            summary: health tscap
            description: Health check - no capability required
            operationId: tscap#health
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                type: string
                                example: Iure dicta.
                            example: Iure dicta.
    /items:
        get:
            tags:
                - tscap
            summary: list tscap
            description: List items - requires read capability
            operationId: tscap#list
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    type: string
                                    example: Maxime dolor quidem.
                                example:
                                    - Maxime dolor quidem.
                                    - Dolores ducimus eos.
                            example:
                                - Maxime dolor quidem.
                                - Dolores ducimus eos.
        post:
            tags:
                - tscap
            summary: create tscap
            description: Create an item - requires write capability
            operationId: tscap#create
            requestBody:
                description: Request body for create.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateRequestBody'
                        example:
                            name: Quo omnis quia ipsum.
            responses:
                "201":
                    description: Created response.
                    content:
                        application/json:
                            schema:
                                type: string
                                example: Voluptatem enim nesciunt sunt omnis.
                            example: Voluptatem enim nesciunt sunt omnis.
    /items/{id}:
        delete:
            tags:
                - tscap
            summary: admin tscap
            description: Admin action - requires admin capability
            operationId: tscap#admin
            parameters:
                - name: id
                  in: path
                  description: Item ID
                  required: true
                  schema:
                    type: string
                    description: Item ID
                    example: Quidem eos voluptas eveniet.
                  example: Quidem eos voluptas eveniet.
            responses:
                "204":
                    description: No Content response.
    /openapi.json:
        get:
            tags:
                - openapi
            summary: Download gen/http/openapi3.json
            operationId: openapi#/openapi.json
            responses:
                "200":
                    description: File downloaded
components:
    schemas:
        CreateRequestBody:
            type: object
            properties:
                name:
                    type: string
                    description: Item name
                    example: Quo omnis quia ipsum.
            description: Request body for create.
            example:
                name: Quo omnis quia ipsum.
            required:
                - name
tags:
    - name: openapi
    - name: tscap
      description: A service demonstrating Tailscale app capabilities
